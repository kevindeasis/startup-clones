<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Rockets - demo page for Hutch</title>
  <script defer src="/track.js" data-site="demo"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b1b1f; background: #fafaf9; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 12px; }
    p { color: #52525b; line-height: 1.6; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button { padding: 10px 16px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; font-size: 1rem; cursor: pointer; }
    button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    code { background: #f4f4f5; padding: 2px 6px; border-radius: 4px; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <main>
    <h1>Acme Rockets</h1>
    <p>A fake marketing page. The tracker in <code>/track.js</code> sends events for the <code>demo</code> site, so you can watch them arrive on the
      <a href="/sites/demo">dashboard</a> in real time.</p>
    <div class="row">
      <button class="primary" id="signup">Sign up</button>
      <button id="pricing">Go to /pricing</button>
      <button id="boom">Throw a JS error</button>
    </div>
    <p id="status"></p>
  </main>
  <script>
    function note(text) { document.getElementById("status").textContent = text; }
    document.getElementById("signup").addEventListener("click", function () {
      window.hutch.track("signup", { plan: "pro" });
      note("Sent custom event: signup");
    });
    document.getElementById("pricing").addEventListener("click", function () {
      history.pushState({}, "", "/pricing");
      note("Pushed /pricing (SPA navigation)");
    });
    document.getElementById("boom").addEventListener("click", function () {
      note("Threw an error");
      setTimeout(function () { throw new Error("Demo error from Acme Rockets"); }, 0);
    });
  </script>
</body>
</html>
