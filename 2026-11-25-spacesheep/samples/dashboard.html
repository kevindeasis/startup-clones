<h1>Weekly Metrics Dashboard</h1>
<p>Signups grew steadily this week, with the biggest jump on Thursday after the launch announcement went out to the newsletter.</p>
<div class="cards"><div class="card">Signups<b>1,284</b></div><div class="card">Activation<b>41%</b></div><div class="card">Revenue<b>$9,420</b></div></div>
