[project]
name = "proven"
version = "0.1.0"
description = "Independent learning clone of Axiomat: verified data queries for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "duckdb>=1.0", "sqlglot>=25.0",
  "anthropic>=0.50", "PyYAML>=6.0", "pydantic>=2.6", "pytest>=8.0", "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
