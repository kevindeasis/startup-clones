[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steer-mirrors-clone"
version = "0.1.0"
description = "Steer: an independent learning clone of Mirrors (scoped, measured, real-time corrections for AI agents)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "anthropic>=2,<3",
]

[tool.setuptools]
packages = ["steer", "steer_sdk", "examples"]

[tool.setuptools.package-data]
steer = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
